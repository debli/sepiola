[package]
name = "sepiola"
version = "1.0.0"
edition = "2021"

[workspace]
members = ["sepiola-gui"]

[dependencies]
clap = { version = "~4.5", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = "0.24"
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23"] }
rawloader = "0.37"
# 电子书内容级元数据抽取（M36）：EPUB 容器、OPF/FB2 XML、PDF 文本层。
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
pdf-extract = "0.7"
