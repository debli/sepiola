[package]
name = "sepiola"
version = "1.0.0"
edition = "2021"

[workspace]
members = ["sepiola-gui"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
clap = { version = "~4.5", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = "0.24"
libheif-rs = { version = "2.6", default-features = false, features = ["v1_17"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23"] }
rawloader = "0.37"
# 电子书内容级元数据抽取（M36）：EPUB 容器、OPF/FB2 XML、PDF 文本层。
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
pdf-extract = "0.7"
encoding_rs = "0.8"
# MOBI/AZW3 正文解压（M44）：纯 Rust PalmDOC / HUFF-CDIC 解码。
mobi = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
lofty = "0.22.4"
chromaprint-next = "0.1"
chrono = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
symphonia = { version = "0.5.5", features = ["aac", "alac", "isomp4", "mp3"] }
